name: Flutter Web Build & Deploy

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # flutter-version: '3.19.0' # Optional: Specify version if needed

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web App
        # Adjust --base-href if deploying to a sub-path (e.g. /my-repo/)
        # If using a custom domain, standard build is usually fine.
        run: flutter build web --release

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
